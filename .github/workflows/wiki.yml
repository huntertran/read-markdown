name: Wiki

# Publishes wiki/ to the GitHub wiki (a separate repository, <repo>.wiki.git). wiki/ is the source of truth:
# pages edited in the web UI are overwritten by the next sync. The wiki repository exists only after its first
# page has been created in the web UI once.

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  sync:
    name: Sync wiki
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Push wiki/ to the wiki repository
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/wiki"
          if ! git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$dest"; then
            echo "::error::Cannot clone ${GITHUB_REPOSITORY}.wiki.git. Enable the wiki and create its first page in the web UI once."
            exit 1
          fi
          rsync -a --delete --exclude .git wiki/ "$dest/"
          cd "$dest"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Wiki already up to date.'
            exit 0
          fi
          git commit -m "Sync from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          git push
